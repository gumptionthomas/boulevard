{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
/* Inlined rather than served separately: one request, no round-trips.
   The shelf is read on cold cellular, outdoors, in bad light. */
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0; background: #fdfcf9; color: #14130d;
  font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
}
.banner {
  background: #14130d; color: #fdfcf9; padding: 14px 18px;
  font-size: 15px; font-weight: 600; line-height: 1.35;
}
.banner span { display: block; font-weight: 400; opacity: .72; font-size: 13px; margin-top: 3px; }
main { padding: 26px 20px; max-width: 34rem; margin: 0 auto; }
.site {
  font: 700 13px/1 ui-serif, Georgia, serif; letter-spacing: .02em;
  opacity: .55; text-transform: uppercase; margin-bottom: 22px;
}
h1 { font: 600 27px/1.2 ui-serif, Georgia, serif; margin: 0 0 14px; }
h2 { font: 600 21px/1.3 ui-serif, Georgia, serif; margin: 0; }
p { margin: 0 0 14px; color: #3b3830; }
p.dim { color: #6b6659; }
.empty { text-align: center; padding: 40px 10px; }
/* One rule, not two: this was declared twice and the second silently won,
   so the effective opacity was never the one written up here. */
.inert { opacity: .4; font-weight: 600; font-size: 13px; letter-spacing: .03em; }
a.btn {
  display: block; text-align: center; padding: 16px; border-radius: 9px;
  font-size: 16px; font-weight: 600; text-decoration: none;
  color: #14130d; border: 2px solid #14130d; margin-top: 28px;
}
@media (prefers-color-scheme: dark) {
  body { background: #14130d; color: #fdfcf9; }
  .banner { background: #fdfcf9; color: #14130d; }
  p { color: #ded9cc; } p.dim { color: #a9a396; }
  a.btn { color: #fdfcf9; border-color: #fdfcf9; }
}
label { display:block; font-size:13px; font-weight:700; margin:20px 0 7px; }
input, textarea, select {
  width:100%; box-sizing:border-box; border:1.5px solid #c9c3b2; border-radius:8px;
  padding:13px; font-size:16px; font-family:inherit; background:#fff; color:#14130d;
}
/* 12.5px is small text under WCAG, so it needs 4.5:1. The old #8a8478 was
   3.6:1 on the light background. #6b6659 is p.dim's colour — 5.6:1 — and the
   dark rule below is not optional: at #6b6659 on #14130d this would be 3.3:1. */
.hint { font-size:12.5px; color:#6b6659; margin:7px 0 0; }
.err { font-size:13px; color:#8a2b20; margin:7px 0 0; font-weight:600; }
button {
  width:100%; margin-top:26px; padding:15px; border:0; border-radius:9px;
  background:#14130d; color:#fdfcf9; font-size:16px; font-weight:600; font-family:inherit;
}
button[disabled] { opacity:.4; }
/* .linkish is the undo control ("Put it back"): a take is the shelf's
   primary action and an undo is not, so it must not be pixel-identical to
   the filled black button — on a twelve-item shelf that reads as twelve
   equally loud slabs, and the one that gives an item back is the one that
   most needs to look different. Outline weight, not smaller or greyer:
   .linkish itself changes only fill and ink, never sizing, so it always
   inherits whatever padding and border-radius the button rules below give
   it — full-size (button's own 15px/9px) on item.html's single control,
   and the same reduced-but-still-large 12px/22px/9px .item form button
   gives every per-item control on the shelf, .linkish included. Either
   way the tap target is not shrunk specifically because it's an undo, and
   the fill uses the same #14130d/#fdfcf9 ink pair a.btn already uses for
   its own outline style, which clears WCAG AA against both backgrounds in
   both colour schemes. */
.linkish { background:transparent; border:2px solid #14130d; color:#14130d; }
/* On the shelf, each item's own take/undo control sits inside a repeated
   .item card, not the page's one primary action — a full-width button per
   item, 26px apart, reads as page furniture rather than a per-item
   control. Scoped to .item so item.html's single take control (the page's
   actual primary action) keeps the full-width treatment. */
.item form button { width:auto; margin-top:12px; padding:12px 22px; }
@media (prefers-color-scheme: dark) {
  input, textarea, select { background:#1e1c15; color:#fdfcf9; border-color:#3a372c; }
  button { background:#fdfcf9; color:#14130d; }
  .linkish { border-color:#fdfcf9; color:#fdfcf9; }
  .err { color:#e8927f; }
}
.item { padding:20px 0; border-bottom:1px solid #e4dfd2; }
.item:last-of-type { border-bottom:none; }
.note { font:400 17px/1.45 ui-serif, Georgia, serif; margin:0 0 10px; }
.note a { color:inherit; text-decoration:none; }
.src { font-size:13px; color:#6b6659; margin:0; }
.itemtext { font:400 15px/1.5 ui-serif, Georgia, serif; color:#3b3830;
            border-left:3px solid #ded9cc; padding-left:14px; margin:0 0 10px; }
/* The take-to-zero band (I-1): distinct from the live shelf on purpose, so
   it reads as "you took the last one" rather than a second shelf. A label
   above it plus a muted rule and a left border on each card, not a new
   background colour — this is one person's own three items at most, not a
   section that needs to compete visually with the shelf itself. */
.bandlabel { font:700 12.5px/1 ui-sans-serif, system-ui, sans-serif; text-transform:uppercase;
             letter-spacing:.04em; color:#6b6659; margin:8px 0 4px; padding-top:18px;
             border-top:1px solid #e4dfd2; }
.item.band { padding-left:14px; border-left:3px solid #c9c3b2; border-bottom:none; }
footer { max-width:34rem; margin:0 auto; padding:0 20px 30px; font-size:12.5px; color:#6b6659; }
footer a { color:inherit; }
@media (prefers-color-scheme: dark) {
  .item { border-color:#33302a; }
  .hint, footer { color:#a9a396; }
  .bandlabel { color:#a9a396; border-color:#33302a; }
  .item.band { border-left-color:#3a372c; }
}
</style>
</head>
<body>
{{template "body" .}}
<!-- DESIGN.md §2: every public page footer carries a source link. AGPL puts
     the source-offer obligation on whoever runs a modified build, and a host
     who never thinks about licensing has to be compliant regardless — so it
     lives in the layout, where no new page can be added without it. -->
<footer><a href="{{.SourceURL}}">Source</a> · {{.BuildLine}}</footer>
</body>
</html>{{end}}
