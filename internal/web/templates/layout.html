{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
/* Inlined rather than served separately: one request, no round-trips.
   The shelf is read on cold cellular, outdoors, in bad light. */
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0; background: #fdfcf9; color: #14130d;
  font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
}
.banner {
  background: #14130d; color: #fdfcf9; padding: 14px 18px;
  font-size: 15px; font-weight: 600; line-height: 1.35;
}
.banner span { display: block; font-weight: 400; opacity: .72; font-size: 13px; margin-top: 3px; }
main { padding: 26px 20px; max-width: 34rem; margin: 0 auto; }
.site {
  font: 700 13px/1 ui-serif, Georgia, serif; letter-spacing: .02em;
  opacity: .55; text-transform: uppercase; margin-bottom: 22px;
}
h1 { font: 600 27px/1.2 ui-serif, Georgia, serif; margin: 0 0 14px; }
h2 { font: 600 21px/1.3 ui-serif, Georgia, serif; margin: 0; }
p { margin: 0 0 14px; color: #3b3830; }
p.dim { color: #6b6659; }
.empty { text-align: center; padding: 40px 10px; }
.inert { opacity: .42; font-weight: 600; font-size: 13px; letter-spacing: .03em; }
a.btn {
  display: block; text-align: center; padding: 16px; border-radius: 9px;
  font-size: 16px; font-weight: 600; text-decoration: none;
  color: #14130d; border: 2px solid #14130d; margin-top: 28px;
}
@media (prefers-color-scheme: dark) {
  body { background: #14130d; color: #fdfcf9; }
  .banner { background: #fdfcf9; color: #14130d; }
  p { color: #ded9cc; } p.dim { color: #a9a396; }
  a.btn { color: #fdfcf9; border-color: #fdfcf9; }
}
label { display:block; font-size:13px; font-weight:700; margin:20px 0 7px; }
input, textarea, select {
  width:100%; box-sizing:border-box; border:1.5px solid #c9c3b2; border-radius:8px;
  padding:13px; font-size:16px; font-family:inherit; background:#fff; color:#14130d;
}
.hint { font-size:12.5px; color:#8a8478; margin:7px 0 0; }
.err { font-size:13px; color:#8a2b20; margin:7px 0 0; font-weight:600; }
button {
  width:100%; margin-top:26px; padding:15px; border:0; border-radius:9px;
  background:#14130d; color:#fdfcf9; font-size:16px; font-weight:600; font-family:inherit;
}
button[disabled] { opacity:.4; }
@media (prefers-color-scheme: dark) {
  input, textarea, select { background:#1e1c15; color:#fdfcf9; border-color:#3a372c; }
  button { background:#fdfcf9; color:#14130d; }
  .err { color:#e8927f; }
}
.item { padding:20px 0; border-bottom:1px solid #e4dfd2; }
.item:last-of-type { border-bottom:none; }
.note { font:400 17px/1.45 ui-serif, Georgia, serif; margin:0 0 10px; }
.note a { color:inherit; text-decoration:none; }
.src { font-size:13px; color:#6b6659; margin:0; }
.itemtext { font:400 15px/1.5 ui-serif, Georgia, serif; color:#3b3830;
            border-left:3px solid #ded9cc; padding-left:14px; margin:0 0 10px; }
.inert { opacity:.4; font-weight:600; }
@media (prefers-color-scheme: dark) { .item { border-color:#33302a; } }
</style>
</head>
<body>
{{template "body" .}}
</body>
</html>{{end}}
